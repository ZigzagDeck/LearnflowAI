name: CI

on:
  pull_request:
  push:
    branches: [main, vm]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frozen dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck and production build
        run: npm run build

  backend:
    name: Backend checks and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend and test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Compile backend modules
        run: python -m compileall -q backend
      - name: Run API tests
        run: python -m pytest backend/tests -q

  docker:
    name: Backend Docker smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f backend/Dockerfile -t learnflow-api:ci .
      - name: Start container
        run: docker run --rm -d --name learnflow-ci -p 8000:8000 learnflow-api:ci
      - name: Check health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          docker logs learnflow-ci
          exit 1
      - name: Stop container
        if: always()
        run: docker rm -f learnflow-ci || true
